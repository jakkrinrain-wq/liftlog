<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>LiftLog</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D10; --surface:#15181D; --surface2:#1E232A; --line:#2A3038;
  --text:#F2F5F7; --muted:#8A94A3; --accent:#C6FF3D; --accent-ink:#0B0D10;
  --hot:#FF6B35; --danger:#FF4D5E;
  --r:16px; --head:'Kanit',system-ui,sans-serif; --body:'IBM Plex Sans Thai','Kanit',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2}
h1{font-size:28px;font-weight:700}
h2{font-size:20px;font-weight:600}
h3{font-size:17px;font-weight:600}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 24px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.section{margin-top:28px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.card.hero{background:linear-gradient(135deg,#1C2410 0%,#15181D 70%);border:1px solid #2E3A17}
.num{font-family:var(--head);font-weight:600;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-family:var(--head);font-weight:600;font-size:17px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #4A2229}
.btn.sm{min-height:40px;font-size:15px;width:auto;padding:0 14px;border-radius:10px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--surface)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:13px;color:var(--muted);margin:0 6px 6px 0}
.chip.acc{background:rgba(198,255,61,.12);color:var(--accent)}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px}
.stat .v{font-family:var(--head);font-size:24px;font-weight:600}
.stat .l{font-size:12px;color:var(--muted)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.day i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-style:normal}
.day.plan i::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.day.done i{background:var(--accent);color:var(--accent-ink)}
.day.done i::after{display:none}
.day.today{color:var(--text);font-weight:600}
.day.today i{outline:2px solid var(--accent);outline-offset:2px}

/* list item */
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}

/* workout */
.wk-head{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.92);backdrop-filter:blur(10px);margin:-16px -16px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.timer{font-family:var(--head);font-size:15px;color:var(--accent)}
.ex-card{background:var(--surface);border-radius:var(--r);padding:14px 12px;margin-bottom:14px}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:8px}
.sets th{font-size:12px;color:var(--muted);font-weight:500;text-align:center}
.sets td{text-align:center;padding:0 3px}
.sets tr.done td{background:rgba(198,255,61,.07)}
.sets tr.done td:first-child{border-radius:10px 0 0 10px}
.sets tr.done td:last-child{border-radius:0 10px 10px 0}
.setn{font-family:var(--head);color:var(--muted);width:28px}
.prev{font-size:13px;color:var(--muted);white-space:nowrap}
.sets input{width:100%;max-width:72px;height:44px;border-radius:10px;border:1px solid transparent;background:var(--surface2);text-align:center;font-family:var(--head);font-size:18px;font-weight:500}
.sets input:focus{outline:none;border-color:var(--accent)}
.sets input::placeholder{color:#59616D}
.check{width:44px;height:44px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
tr.done .check{background:var(--accent);color:var(--accent-ink)}
.link{color:var(--accent);font-family:var(--head);font-weight:500;padding:10px 4px}

/* rest pill */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:20;display:none;align-items:center;gap:6px;background:var(--hot);color:#160A04;border-radius:999px;padding:6px 8px 6px 18px;box-shadow:0 8px 30px rgba(255,107,53,.35)}
#rest.on{display:flex}
#rest .t{font-family:var(--head);font-weight:700;font-size:22px;min-width:64px}
#rest button{height:36px;min-width:44px;border-radius:999px;background:rgba(0,0,0,.15);font-family:var(--head);font-weight:600;font-size:14px;padding:0 10px}

/* segmented */
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:9px;font-family:var(--head);font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}

select,.input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;font-size:16px}
select:focus,.input:focus{outline:none;border-color:var(--accent)}
.chart{width:100%;height:auto;display:block}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(15,17,21,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;font-family:var(--head)}
.nav button.on{color:var(--accent)}
.nav .dot{position:absolute;margin:-30px 0 0 22px;width:8px;height:8px;border-radius:50%;background:var(--hot)}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:480px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
#sheet.on{transform:none}
#scrim.on{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0 4px;border-bottom:1px solid var(--line);text-align:left}
.pick:active{background:var(--surface2)}
.muscle-h{font-family:var(--head);color:var(--accent);font-size:14px;margin:18px 0 4px}

#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);z-index:40;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-family:var(--head);font-weight:500;transition:transform .3s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
#toast.pr{background:var(--accent)}
.grow{flex:1;min-width:0}
.hero-big{padding:20px}
/* ภาพสาธิตท่า: สลับรูปจังหวะเริ่ม-จบ ให้เห็นการเคลื่อนไหว */
.demo{position:relative;background:#fff;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img.b{animation:flip 2.2s ease-in-out infinite}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.thumb{width:64px;height:48px;border-radius:8px;background:#fff;object-fit:cover;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;height:38px;padding:0 14px;border-radius:999px;background:var(--surface2);color:var(--muted);font-family:var(--head)}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.prow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
.prow .info{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;min-height:56px}
.prow .add{width:44px;height:44px;border-radius:12px;background:rgba(198,255,61,.12);color:var(--accent);display:grid;place-items:center;flex:none}
.steps{margin:8px 0 0;padding-left:22px}
.steps li{margin-bottom:8px}
details summary{cursor:pointer;padding:8px 0}
.hero-big h1{font-size:30px;margin:2px 0}
.btn.xl{min-height:64px;font-size:20px;border-radius:18px}
.focus{background:var(--surface);border-radius:20px;padding:20px 16px;text-align:center}
.focus h1{font-size:26px}
.stepper{display:grid;grid-template-columns:68px minmax(0,1fr) 68px;gap:10px;align-items:center;margin-top:14px}
.btn.sm{white-space:nowrap}
.wk-head h2{font-size:18px}
.stepper button{height:68px;border-radius:16px;background:var(--surface2);font-family:var(--head);font-size:30px;font-weight:600}
.stepper button:active{background:var(--line)}
.stepper .val{display:flex;align-items:baseline;justify-content:center;gap:6px;min-width:0}
.stepper input{width:100%;min-width:0;max-width:140px;background:none;border:0;text-align:center;font-family:var(--head);font-size:46px;font-weight:700;color:var(--text);padding:0}
.stepper input:focus{outline:none;color:var(--accent)}
.stepper .u{color:var(--muted);font-size:15px}
.btn.done{min-height:78px;font-size:22px;border-radius:20px;margin-top:20px}
.pbar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.next-item{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0 4px;border-bottom:1px solid var(--line);text-align:left}
#rest .lbl,#rest .nx{display:none}
#rest .rb{display:flex;gap:6px}
#rest.full{inset:0;transform:none;border-radius:0;flex-direction:column;justify-content:center;gap:20px;background:rgba(11,13,16,.97);color:var(--text);padding:24px;box-shadow:none;text-align:center}
#rest.full .lbl,#rest.full .nx{display:block}
#rest.full .t{font-size:100px;color:var(--hot);min-width:0}
#rest.full button{height:60px;min-width:84px;font-size:18px;background:var(--surface2);color:var(--text)}
#rest.full button.skip{background:var(--accent);color:var(--accent-ink)}
.recov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rc{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.tip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(198,255,61,.08);font-size:14px}
.tip b{color:var(--accent);font-weight:600}
.tip button{flex:none;height:34px;padding:0 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--head);font-weight:600;font-size:14px}
.warn{background:#2A1A10;border:1px solid #5A3216;color:#FFB48F;border-radius:14px;padding:12px 14px;font-size:14px}
/* ============ ธีมกระจก (Glassmorphism) ============ */
:root{
  --bg:#07090C; --surface:rgba(255,255,255,.06); --surface2:rgba(255,255,255,.09); --line:rgba(255,255,255,.10);
  --glass-border:rgba(255,255,255,.12); --blur:blur(22px) saturate(160%);
}
body{background:transparent}
/* แสงสีด้านหลัง ให้กระจกมีอะไรให้เบลอ */
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(420px circle at 12% 6%, rgba(198,255,61,.28), transparent 65%),
    radial-gradient(380px circle at 95% 32%, rgba(124,92,255,.30), transparent 65%),
    radial-gradient(420px circle at 0% 78%, rgba(255,107,53,.22), transparent 65%),
    radial-gradient(360px circle at 85% 100%, rgba(0,200,255,.18), transparent 65%), var(--bg)}
.card,.stat,.ex-card,.focus,.rc,.seg,.icon-btn,.btn.ghost,.wk-head,.nav,#sheet,.stepper button{
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 8px 32px rgba(0,0,0,.25)}
.wk-head{background:rgba(7,9,12,.55);border-width:0 0 1px}
.nav{background:rgba(12,14,18,.55);border-width:1px 0 0;box-shadow:none}
#sheet{background:rgba(18,21,27,.78);border-width:1px 1px 0}
.card.hero{background:linear-gradient(135deg,rgba(198,255,61,.20),rgba(255,255,255,.05) 60%);border-color:rgba(198,255,61,.30)}
.btn.primary{box-shadow:0 8px 28px rgba(198,255,61,.30), inset 0 1px 0 rgba(255,255,255,.5)}
.seg button.on{background:rgba(255,255,255,.14)}
.sets input,select,.input{background:rgba(255,255,255,.07);border-color:var(--glass-border)}
select option{background:#15181D;color:var(--text)}
#rest.full{background:rgba(7,9,12,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
#rest:not(.full){backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.focus .demo,.cat{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bodymap{display:flex;gap:4px;flex:none}
.bodymap svg{display:block;width:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* หมวดหมู่ท่า */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cat{height:112px;border-radius:18px;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:12px 14px;color:#fff;border:1px solid rgba(255,255,255,.18);text-align:left}
.cat b{font-family:var(--head);font-size:22px;line-height:1.1}
.cat span{font-size:13px;opacity:.9}
</style>
</head>
<body>
<main class="wrap" id="view"></main>

<div id="rest"><div class="lbl muted">พักก่อน หายใจลึกๆ</div><span class="t" id="restT">1:30</span><div class="nx" id="restNext"></div><div class="rb"><button data-a="restAdd" data-s="-15">−15</button><button data-a="restAdd" data-s="15">+15</button><button class="skip" data-a="restStop">ข้าม</button></div></div>

<nav class="nav"><div class="in">
  <button data-a="go" data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>หน้าแรก</button>
  <button data-a="go" data-tab="workout"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>เล่น</button>
  <button data-a="go" data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>ความก้าวหน้า</button>
  <button data-a="go" data-tab="plan"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>โปรแกรม</button>
</div></nav>

<div id="scrim" data-a="closeSheet"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ============ ข้อมูล & การเก็บข้อมูล (เก็บในเครื่องเท่านั้น) ============ */
const KEY = 'liftlog-v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MUSCLES = ['อก','หลัง','ขา','ไหล่','แขน','หน้าท้อง'];
const DAYS = ['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const DAYS_SHORT = ['จ','อ','พ','พฤ','ศ','ส','อา'];
const REST_DEFAULT = 90;

function seed() {
  const lib = {
    'อก': ['Bench Press','Incline Dumbbell Press','Chest Fly (เครื่อง)','Push-up'],
    'หลัง': ['Lat Pulldown','Seated Cable Row','Deadlift','Pull-up','Bent-over Row'],
    'ขา': ['Squat','Leg Press','Romanian Deadlift','Leg Extension','Leg Curl','Calf Raise'],
    'ไหล่': ['Overhead Press','Lateral Raise','Face Pull'],
    'แขน': ['Barbell Curl','Hammer Curl','Triceps Pushdown','Skull Crusher'],
    'หน้าท้อง': ['Plank','Cable Crunch','Hanging Leg Raise'],
  };
  const exercises = [];
  for (const m in lib) lib[m].forEach(name => exercises.push({ id: uid(), name, muscle: m }));
  const id = n => exercises.find(e => e.name === n).id;
  const push = { id: uid(), name: 'Push · อก ไหล่ หลังแขน', exerciseIds: ['Bench Press','Incline Dumbbell Press','Overhead Press','Lateral Raise','Triceps Pushdown'].map(id) };
  const pull = { id: uid(), name: 'Pull · หลัง หน้าแขน', exerciseIds: ['Lat Pulldown','Seated Cable Row','Bent-over Row','Face Pull','Barbell Curl'].map(id) };
  const legs = { id: uid(), name: 'Legs · ขา หน้าท้อง', exerciseIds: ['Squat','Leg Press','Romanian Deadlift','Leg Curl','Calf Raise','Plank'].map(id) };
  return {
    version: 1, exercises, templates: [push, pull, legs],
    schedule: [push.id, pull.id, legs.id, null, push.id, pull.id, null],
    workouts: [], bodyweight: [], active: null, lastBackup: null,
    planMode: 'rotation', goal: 4,
  };
}
// ชื่อท่าภาษาไทย (ใช้กับข้อมูลเก่าได้ด้วย เพราะจับคู่จากชื่อ)
const TH = {
  'Bench Press': 'นอนดันบาร์', 'Incline Dumbbell Press': 'ดันดัมเบลบนม้านั่งเอียง', 'Chest Fly (เครื่อง)': 'เครื่องหนีบอก', 'Push-up': 'วิดพื้น',
  'Lat Pulldown': 'ดึงบาร์ลงหน้าอก', 'Seated Cable Row': 'นั่งดึงเคเบิลเข้าลำตัว', 'Deadlift': 'ยกบาร์จากพื้น', 'Pull-up': 'โหนบาร์ดึงข้อ', 'Bent-over Row': 'ก้มตัวดึงบาร์',

const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
function plates(target, bar) {
  let side = (target - bar) / 2; const out = [];
  if (side < 0) return null;
  PLATES.forEach(p => { while (side >= p - 1e-9) { out.push(p); side -= p; } });
  return { out, rest: +(side * 2).toFixed(2) };
}

/* ============ กราฟ (วาดเองด้วย SVG) ============ */
function lineChart(pts, unit = '') {
  if (pts.length < 2) return `<div class="empty">บันทึกอย่างน้อย 2 ครั้ง กราฟจะขึ้นตรงนี้</div>`;
  const W = 340, H = 170, L = 6, R = 40, T = 18, B = 24;
  const ys = pts.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * .2; lo -= pad; hi += pad;
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  const area = `M${x(0)},${H-B} L${line.replace(/ /g,' L')} L${x(pts.length-1)},${H-B} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6FF3D" stop-opacity=".28"/><stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/></linearGradient></defs>
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#2A3038"/>
    <path d="${area}" fill="url(#g)"/>
    <polyline points="${line}" fill="none" stroke="#C6FF3D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="${i === pts.length-1 ? 5 : 3}" fill="${i === pts.length-1 ? '#C6FF3D' : '#15181D'}" stroke="#C6FF3D" stroke-width="2"/>`).join('')}
    <text x="${x(pts.length-1)+8}" y="${y(last.y)+5}" fill="#F2F5F7" font-family="Kanit" font-size="14" font-weight="600">${last.y}${unit}</text>
    <text x="${L}" y="${H-6}" fill="#8A94A3" font-family="Kanit" font-size="11">${esc(pts[0].label)}</text>
    <text x="${W-R}" y="${H-6}" fill="#8A94A3" font-family="Kanit" font-size="11" text-anchor="end">${esc(last.label)}</text>
  </svg>`;
}
function barChart(bars) {
  const W = 340, H = 140, T = 18, B = 22, gap = 10;
  const max = Math.max(1, ...bars.map(b => b.v));
  const bw = (W - gap * (bars.length - 1)) / bars.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${bars.map((b, i) => {
    const h = (b.v / max) * (H - T - B), X = i * (bw + gap), Y = H - B - h;
    const last = i === bars.length - 1;
    return `<rect x="${X}" y="${Y}" width="${bw}" height="${Math.max(h, 2)}" rx="6" fill="${last ? '#C6FF3D' : '#2F3742'}"/>
      ${b.v ? `<text x="${X+bw/2}" y="${Y-5}" fill="${last ? '#C6FF3D' : '#8A94A3'}" font-family="Kanit" font-size="12" text-anchor="middle">${b.v}</text>` : ''}
      <text x="${X+bw/2}" y="${H-5}" fill="#8A94A3" font-family="Kanit" font-size="10" text-anchor="middle">${esc(b.label)}</text>`;
  }).join('')}</svg>`;
}

  <div class="stack"><button class="btn ghost" data-a="pickEx" data-for="active">${I.plus} เพิ่มท่า</button>
    <button class="btn danger" data-a="cancelWorkout">ยกเลิกการเล่นครั้งนี้</button></div>`;
}

function Progress() {
  const seg = `<div class="seg">${[['overview','ภาพรวม'],['ex','รายท่า'],['bw','น้ำหนักตัว']].map(([k, l]) => `<button class="${progTab === k ? 'on' : ''}" data-a="progTab" data-k="${k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (progTab === 'overview') {
    const ws = weekStart(new Date()), bars = [];
    for (let i = 7; i >= 0; i--) {
      const s = new Date(ws); s.setDate(s.getDate() - i * 7);
      const e = new Date(s); e.setDate(e.getDate() + 7);
      const ww = S.workouts.filter(w => { const d = new Date(w.date); return d >= s && d < e; });
      bars.push({ label: fmtShort(s), v: ww.length, vol: ww.reduce((a, w) => a + volume(w), 0) });
    }
    const totalVol = S.workouts.reduce((a, w) => a + volume(w), 0);
    const totalTime = S.workouts.reduce((a, w) => a + w.duration, 0);
    body = `<div class="card section"><h3>จำนวนครั้งที่เล่นต่อสัปดาห์</h3><p class="muted small" style="margin:2px 0 12px">8 สัปดาห์ล่าสุด</p>${barChart(bars)}</div>
      <div class="stats section">
        <div class="stat"><div class="v">${S.workouts.length}</div><div class="l">ครั้งทั้งหมด</div></div>
        <div class="stat"><div class="v">${kfmt(totalVol)}</div><div class="l">kg ที่ยกรวม</div></div>
        <div class="stat"><div class="v">${Math.round(totalTime / 3600)}</div><div class="l">ชั่วโมงในยิม</div></div></div>`;
  } else if (progTab === 'ex') {
    const used = S.exercises.filter(e => S.workouts.some(w => w.items.some(it => it.exerciseId === e.id)));
    if (!used.length) body = `<div class="empty section">ยังไม่มีข้อมูล — เล่นแล้วกด ✓ ในแต่ละเซ็ต กราฟจะเริ่มขึ้น</div>`;
    else {
      if (!used.find(e => e.id === progEx)) progEx = used[0].id;
      const hist = S.workouts.map(w => ({ w, it: w.items.find(it => it.exerciseId === progEx) })).filter(x => x.it && x.it.sets.length);
      const pts = hist.map(({ w, it }) => ({ label: fmtShort(w.date), y: Math.max(...it.sets.map(s => num(s.w))) }));
      const pr = Math.max(...pts.map(p => p.y));
      const first = pts[0].y, last = pts[pts.length - 1].y, diff = +(last - first).toFixed(1);
      const orm = Math.round(Math.max(...hist.flatMap(({ it }) => it.sets.map(e1rm))));
      body = `<div class="section"><select data-a="progEx">${used.map(e => `<option value="${e.id}" ${e.id === progEx ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
        <div class="card section"><h3>น้ำหนักสูงสุดแต่ละครั้ง (kg)</h3><div style="margin-top:10px">${lineChart(pts.slice(-12), '')}</div></div>
        <div class="stats section">
          <div class="stat"><div class="v" style="color:var(--accent)">${pr}</div><div class="l">สถิติสูงสุด (kg)</div></div>
          <div class="stat"><div class="v">${diff > 0 ? '+' : ''}${diff}</div><div class="l">เพิ่มขึ้นจากครั้งแรก</div></div>
          <div class="stat"><div class="v">${orm}</div><div class="l">1RM โดยประมาณ (kg)</div></div></div>
        <p class="muted small" style="margin:8px 2px 0">1RM = น้ำหนักสูงสุดที่น่าจะยกได้ 1 ครั้ง คำนวณจากเซ็ตที่ดีที่สุด · เล่นท่านี้มาแล้ว ${pts.length} ครั้ง</p>
        <div class="section"><h2>ประวัติ</h2><div class="card" style="padding:4px 16px;margin-top:12px">${hist.slice(-6).reverse().map(({ w, it }) => `
          <div class="item"><div class="muted small" style="width:64px">${fmtShort(w.date)}</div><div class="grow num">${it.sets.map(s => `${s.w}×${s.r}`).join('&nbsp; ')}</div></div>`).join('')}</div></div>`;
    }
  } else {
    const list = S.bodyweight;
    const pts = list.slice(-20).map(b => ({ label: fmtShort(b.date), y: b.kg }));
    const change = list.length > 1 ? +(list[list.length - 1].kg - list[0].kg).toFixed(1) : null;
    body = `<div class="card section stack"><h3>บันทึกน้ำหนักวันนี้</h3>
        <div class="row"><input class="input num" id="bwIn" inputmode="decimal" placeholder="เช่น 68.5" style="font-size:20px">
        <button class="btn primary sm" style="height:48px" data-a="addBw">บันทึก</button></div></div>
      <div class="card section"><div class="row between"><h3>น้ำหนักตัว (kg)</h3>${change !== null ? `<span class="chip ${change <= 0 ? 'acc' : ''}">${change > 0 ? '+' : ''}${change} kg จากครั้งแรก</span>` : ''}</div>
        <div style="margin-top:10px">${lineChart(pts, '')}</div></div>
      ${list.length ? `<div class="card section" style="padding:4px 16px">${list.slice(-8).reverse().map(b => `
        <div class="item"><div class="grow">${fmtLong(b.date)}</div><div class="num">${b.kg} kg</div>
        <button class="icon-btn" style="background:none;width:36px" data-a="rmBw" data-d="${b.date}" aria-label="ลบ">${I.x}</button></div>`).join('')}</div>` : ''}`;
  }
  return `<h1>ความก้าวหน้า</h1><div class="section" style="margin-top:16px">${seg}</div>${body}`;
}

function render() {
  $('#view').innerHTML = ({ home: Home, workout: Workout, progress: Progress, plan: Plan })[tab]();
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === tab);

/* ============ Bottom sheet ============ */
let sheetFor = null;
function openSheet(html) { $('#sheet').innerHTML = `<div class="grab"></div>${html}`; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet() { $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }

let pickQ = '', pickM = '', pickE = '', pickN = 30, infoFromPicker = false;
const CAT_IMG = { 'อก': 'Barbell_Bench_Press_-_Medium_Grip', 'หลัง': 'Wide-Grip_Lat_Pulldown', 'ขา': 'Barbell_Squat', 'ไหล่': 'Side_Lateral_Raise', 'แขน': 'Barbell_Curl', 'หน้าท้อง': 'Plank' };
const EQ_FILTER = [['', 'ทุกอุปกรณ์'], ['machine', 'เครื่อง'], ['dumbbell', 'ดัมเบล'], ['barbell', 'บาร์เบล'], ['cable', 'เคเบิล'], ['body only', 'ไม่ใช้อุปกรณ์']];
function exercisePicker() {
  return `<div class="row between"><h2>${pickM ? `<button class="link" style="padding:0 8px 0 0;font-size:inherit" data-a="pickM" data-m="" aria-label="กลับไปหมวดทั้งหมด">‹</button>ท่า${pickM}` : sheetFor ? 'เลือกท่า' : 'คลังท่า'}</h2>
      ${!sheetFor ? `<button class="icon-btn" data-a="closeSheet" aria-label="ปิด">${I.x}</button>` : ''}</div>
    <input class="input" style="margin-top:14px" id="exSearch" placeholder="ค้นหา เช่น bench, squat, หน้าแขน, ดัมเบล" value="${esc(pickQ)}">
    ${pickM ? `<div class="chips" style="margin-top:10px">${EQ_FILTER.map(([k, l]) => `<button class="${pickE === k ? 'on' : ''}" data-a="pickE" data-e="${k}">${l}</button>`).join('')}</div>
      <p class="muted small" style="margin:6px 0 0">แตะที่ท่าเพื่อดูภาพสาธิตและวิธีเล่น${sheetFor ? ' · กด + เพื่อเพิ่มเลย' : ''}</p>` : ''}
    <div id="exList">${pickList()}</div>
    ${sheetFor ? `<div class="card section stack" style="background:var(--surface2)"><h3>ไม่เจอท่าที่ต้องการ? สร้างเอง</h3>
      <input class="input" id="newExName" placeholder="ชื่อท่า" value="${esc(pickQ)}" style="background:var(--surface)">
      <select id="newExMuscle" style="background:var(--surface)">${MUSCLES.map(m => `<option>${m}</option>`).join('')}</select>
      <button class="btn primary" data-a="createEx">สร้างและเพิ่ม</button></div>` : ''}`;
}

function pickList() {
  const q = pickQ.trim().toLowerCase();
  const hit = (name, extra) => !q || name.toLowerCase().includes(q) || th(name).includes(q) || extra.toLowerCase().includes(q);
  const prow = (libId, exId, name, sub) => `<div class="prow"><button class="info" data-a="exInfo" data-lib="${libId || ''}" data-id="${exId}">${thumb(libId)}<span class="grow">${esc(name)}<br><span class="muted small">${esc(sub)}</span></span></button>
    ${sheetFor ? `<button class="add" data-a="addLib" data-lib="${libId || ''}" data-id="${exId}" aria-label="เพิ่ม ${esc(name)}">${I.plus}</button>` : ''}</div>`;
  // หน้าแรกของคลัง: การ์ดหมวดกล้ามเนื้อ
  if (!pickM && !q) {
    const n = m => (LIB ? LIB.filter(x => x.m === m).length : 0) + S.exercises.filter(e => e.muscle === m && !exLib(e)).length;
    return `<div class="cats">${MUSCLES.map(m => `<button class="cat" data-a="pickM" data-m="${m}" style="background-image:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.78)),url('${IMG(CAT_IMG[m])}0.jpg')"><b>${m}</b><span>${LIB ? n(m) + ' ท่า' : '&nbsp;'}</span></button>`).join('')}</div>`
      + (sheetFor && S.exercises.length ? `<div class="muscle-h section">ท่าของฉัน</div>` + S.exercises.map(e => prow(exLib(e), e.id, e.name, th(e.name) || e.muscle)).join('') : '');
  }
  const eqOk = x => !pickE || x === pickE;
  const mine = S.exercises.filter(e => (!pickM || e.muscle === pickM) && hit(e.name, e.muscle) && (!pickE || (LIBX[exLib(e)] && eqOk(LIBX[exLib(e)].e))));
  const have = new Set(S.exercises.map(exLib).filter(Boolean));
  let out = mine.length ? `<div class="muscle-h">ท่าของฉัน</div>` + mine.map(e => prow(exLib(e), e.id, e.name, th(e.name) || e.muscle)).join('') : '';
  if (!LIB) return out + `<div class="empty">กำลังโหลดคลังท่า… (ครั้งแรกต้องต่อเน็ต)</div>`;
  const res = LIB.filter(x => !have.has(x.i) && (!pickM || x.m === pickM) && eqOk(x.e) && hit(x.n, `${x.m} ${x.p.map(p => MUSCLE_TH[p] || p).join(' ')} ${EQUIP_TH[x.e] || x.e} ${x.e}`));
  out += `<div class="muscle-h">คลังท่า · ${res.length} ท่า</div>` + res.slice(0, pickN).map(x => prow(x.i, '', x.n, `${x.p.map(p => MUSCLE_TH[p] || p).join(', ')} · ${EQUIP_TH[x.e] || x.e} · ${LEVEL_TH[x.l] || ''}`)).join('');
  if (res.length > pickN) out += `<button class="btn ghost section" data-a="pickMore">แสดงเพิ่ม (${res.length - pickN})</button>`;
  if (!mine.length && !res.length) out += `<div class="empty">ไม่พบท่านี้ — สร้างเองด้านล่างได้เลย</div>`;
  return out;
}

      <div class="row between"><span class="muted small">ป้องกันเบราว์เซอร์ลบข้อมูลอัตโนมัติ</span><span class="small" id="persist">กำลังตรวจ…</span></div></div>
    <div class="card section stack" style="background:var(--surface2);margin-top:16px"><div class="row between"><h3>เวลาพักระหว่างเซ็ต</h3>
      <select id="restSel" style="width:130px;height:44px;background:var(--surface)">${[60, 90, 120, 150, 180, 240].map(s => `<option value="${s}" ${(S.restSec || REST_DEFAULT) === s ? 'selected' : ''}>${mmss(s)} นาที</option>`).join('')}</select></div>
      <p class="muted small" style="margin:0">ท่าหนักแบบ Squat หรือ Deadlift แนะนำ 2–3 นาที ท่าเล็กอย่างแขนหรือไหล่ 1–1:30 นาที</p></div>
    <div class="stack section" style="margin-top:16px">
      <button class="btn primary" data-a="exportData">สำรองข้อมูล (ส่งออกไฟล์)</button>
      <button class="btn ghost" data-a="importData">กู้คืนจากไฟล์สำรอง</button>
      <button class="btn danger" data-a="resetData">ลบข้อมูลทั้งหมด</button></div>`);
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { const el = $('#persist'); if (el) el.textContent = p ? 'เปิดแล้ว' : 'ยังไม่เปิด (ติดตั้งแอปลงหน้าจอจะช่วยได้)'; });
  else $('#persist').textContent = 'ไม่รองรับ';
}

/* ============ Rest timer ============ */
let restEnd = 0;
function startRest(sec = S.restSec || REST_DEFAULT) { restEnd = Date.now() + sec * 1000; tick(); }
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.3, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .2); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .2); });
  } catch (e) {}
}
function tick() {
  const el = $('#elapsed'); if (el && S.active) el.textContent = mmss(Math.floor((Date.now() - S.active.start) / 1000));
  const r = $('#rest');
  // โหมดทีละเซ็ต: เวลาพักขึ้นเต็มจอ พร้อมบอกเซ็ตต่อไป
  r.classList.toggle('full', !!(S.active && tab === 'workout' && wkView === 'focus'));
  const c = restEnd && cursor();
  if (c) { const it = S.active.items[c.ii], s = it.sets[c.si]; $('#restNext').innerHTML = `<div class="muted small">ต่อไป</div><h2>${esc(ex(it.exerciseId).name)} · เซ็ต ${c.si + 1}</h2><div class="num" style="font-size:22px;margin-top:4px">${s.w || 0} kg × ${s.r} ครั้ง</div>`; }
  if (restEnd) {
    const left = Math.ceil((restEnd - Date.now()) / 1000);
    if (left <= 0) { restEnd = 0; r.classList.remove('on'); if (navigator.vibrate) navigator.vibrate([300, 120, 300]); beep(); toast('หมดเวลาพัก — ลุยเซ็ตต่อไป!'); }
    else { r.classList.add('on'); $('#restT').textContent = mmss(left); }
  } else r.classList.remove('on');
}
setInterval(tick, 500);

/* ============ Toast ============ */
var toastT;
function toast(msg, pr = false) { const t = $('#toast'); t.textContent = msg; t.className = 'on' + (pr ? ' pr' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2600); }

/* ============ Actions ============ */
const A = {
  go: el => { tab = el.dataset.tab; render(); scrollTo(0, 0); },
  settings: settingsSheet,
  closeSheet,
  start: el => {
    if (S.active && !confirm('มีการเล่นค้างอยู่ จะเริ่มใหม่และทิ้งอันเดิมไหม?')) return;
    const t = tpl(el.dataset.t);
    S.active = { tid: t ? t.id : null, name: t ? t.name : 'เล่นอิสระ', start: Date.now(), items: (t ? t.exerciseIds : []).map(newItem) };
    focusIi = null; wkView = 'focus'; restEnd = 0;
    save(); closeSheet(); tab = 'workout'; render(); scrollTo(0, 0); wakeOn();
    if (!S.active.items.length) A.pickEx({ dataset: { for: 'active' } });
  },
  toggleSet: el => {
    const s = S.active.items[el.dataset.i].sets[el.dataset.s];
    if (!s.done) completeSet(+el.dataset.i, +el.dataset.s, false);
    else { s.done = false; save(); render(); }
  },
  step: el => {
    const c = cursor(); if (!c) return;
    const s = S.active.items[c.ii].sets[c.si], f = el.dataset.f;
    s[f] = String(+Math.max(0, num(s[f]) + num(el.dataset.d)).toFixed(2)); save();
    const inp = document.querySelector(`[data-ff="${f}"]`); if (inp) inp.value = s[f];
  },
  doneSet: () => { const c = cursor(); if (c) completeSet(c.ii, c.si, true); },
  addSetF: () => { const c = cursor(); if (!c) return; const it = S.active.items[c.ii], l = it.sets[it.sets.length - 1]; it.sets.push({ w: l.w, r: l.r, done: false }); save(); render(); toast('เพิ่มเซ็ตแล้ว'); },
  skipEx: () => {
    const c = cursor(); if (!c) return;
    const it = S.active.items[c.ii]; it.sets = it.sets.filter(s => s.done);
    if (!it.sets.length) S.active.items.splice(c.ii, 1);
    focusIi = null; save(); render(); if (!cursor()) askFinish();
  },
  jump: el => { focusIi = +el.dataset.i; render(); scrollTo(0, 0); },
  wkView: el => { wkView = el.dataset.v; render(); tick(); scrollTo(0, 0); },
  planMode: el => { S.planMode = el.dataset.m; save(); render(); },
  tplOrder: el => { const i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= S.templates.length) return; [S.templates[i], S.templates[j]] = [S.templates[j], S.templates[i]]; save(); render(); },
  addSet: el => { const it = S.active.items[el.dataset.i], l = it.sets[it.sets.length - 1]; it.sets.push({ w: l ? l.w : '', r: l ? l.r : '', done: false }); save(); render(); },
  rmSet: el => { S.active.items[el.dataset.i].sets.pop(); save(); render(); },
  rmItem: el => { if (!confirm('ลบท่านี้ออกจากการเล่นครั้งนี้?')) return; S.active.items.splice(el.dataset.i, 1); save(); render(); },
  cancelWorkout: () => { if (!confirm('ยกเลิกและไม่บันทึกการเล่นครั้งนี้?')) return; S.active = null; restEnd = 0; wakeOff(); save(); tab = 'home'; render(); },
  finish: () => {
    const a = S.active;
    const items = a.items.map(it => ({ exerciseId: it.exerciseId, sets: it.sets.filter(s => s.done).map(s => ({ w: num(s.w), r: num(s.r) })) })).filter(it => it.sets.length);
    if (!items.length) { if (confirm('ยังไม่ได้กด ✓ สักเซ็ต — ยกเลิกการเล่นครั้งนี้เลยไหม?')) { S.active = null; restEnd = 0; wakeOff(); save(); closeSheet(); tab = 'home'; render(); } return; }
    const prs = items.filter(it => { const before = bestWeight(it.exerciseId); const now = Math.max(...it.sets.map(s => s.w)); return before > 0 && now > before; })
      .map(it => `${ex(it.exerciseId).name} ${Math.max(...it.sets.map(s => s.w))} kg`);
    const prevSame = [...S.workouts].reverse().find(w => w.name === a.name);
    const w = { id: uid(), tid: a.tid || null, name: a.name, date: new Date(a.start).toISOString(), duration: Math.floor((Date.now() - a.start) / 1000), items };
    S.workouts.push(w);
    S.active = null; restEnd = 0; wakeOff(); save(); tab = 'home'; render(); scrollTo(0, 0);
    const needBackup = !S.lastBackup || Date.now() - S.lastBackup > 7 * 864e5;
    // หน้าสรุปหลังเล่น (แบบ Hevy/Strong)
    const vol = volume(w), pv = prevSame ? volume(prevSame) : 0, ch = pv ? Math.round((vol - pv) / pv * 100) : null;
    openSheet(`<div style="text-align:center"><div class="muted small">เล่นเสร็จแล้ว · ครั้งที่ ${S.workouts.length}</div><h1 style="margin:4px 0 2px">เยี่ยมมาก!</h1><div class="muted">${esc(w.name)}</div></div>
      <div class="stats section">
        <div class="stat"><div class="v">${Math.round(w.duration / 60)}</div><div class="l">นาที</div></div>
        <div class="stat"><div class="v">${setCount(w)}</div><div class="l">เซ็ต</div></div>
        <div class="stat"><div class="v">${kfmt(vol)}</div><div class="l">kg รวม${ch !== null ? ` <span style="color:${ch >= 0 ? 'var(--accent)' : 'var(--hot)'}">${ch >= 0 ? '+' : ''}${ch}%</span>` : ''}</div></div></div>
      ${prs.length ? `<div class="card section" style="background:rgba(198,255,61,.08);border:1px solid #3A4A12"><h3 style="color:var(--accent)">🏆 สถิติใหม่ ${prs.length} ท่า</h3>${prs.map(p => `<div style="margin-top:6px">${esc(p)}</div>`).join('')}</div>` : ''}
      ${ch !== null ? `<p class="muted small" style="text-align:center">${ch >= 0 ? 'ยกรวมได้มากกว่า' : 'ยกรวมได้น้อยกว่า'}ครั้งก่อนของโปรแกรมนี้ ${Math.abs(ch)}%</p>` : ''}
      ${needBackup ? `<button class="btn ghost section" data-a="exportData">สำรองข้อมูลตอนนี้ (5 วินาที)</button>` : ''}
      <button class="btn primary section" data-a="closeSheet">ปิด</button>`);
  },
  applySug: el => { S.active.items[el.dataset.i].sets.forEach(s => { if (!s.done) { s.w = el.dataset.w; s.r = '8'; } }); save(); render(); toast('ตั้งน้ำหนักใหม่แล้ว สู้ๆ!'); },
  plateCalc: () => {
    openSheet(`<h2>คำนวณจานน้ำหนัก</h2><p class="muted small">ใส่น้ำหนักรวมที่อยากยก แอปจะบอกว่าต้องใส่จานข้างละกี่แผ่น</p>
      <div class="row"><input class="input num" id="pcW" inputmode="decimal" placeholder="เช่น 60" style="font-size:20px">
      <select id="pcBar" style="width:150px"><option value="20">บาร์ 20 kg</option><option value="15">บาร์ 15 kg</option><option value="10">บาร์ 10 kg</option><option value="0">ไม่มีบาร์</option></select></div>
      <div id="pcOut" class="section"></div>`);
    const c = cursor(); if (c) { $('#pcW').value = S.active.items[c.ii].sets[c.si].w; drawPlates(); }
  },
  restAdd: el => { restEnd += num(el.dataset.s) * 1000; tick(); },
  restStop: () => { restEnd = 0; tick(); },

  pickEx: el => { sheetFor = el.dataset.for; pickQ = ''; pickM = ''; pickN = 30; openSheet(exercisePicker()); },
  pickM: el => { pickM = el.dataset.m; pickE = ''; pickQ = ''; pickN = 30; openSheet(exercisePicker()); $('#sheet').scrollTop = 0; },
  pickE: el => { pickE = el.dataset.e; pickN = 30; $('#exList').innerHTML = pickList(); document.querySelectorAll('[data-a=pickE]').forEach(b => b.classList.toggle('on', b.dataset.e === pickE)); },
  browseLib: () => { sheetFor = null; pickQ = ''; pickM = ''; pickE = ''; pickN = 30; openSheet(exercisePicker()); },
  pickMore: () => { pickN += 30; $('#exList').innerHTML = pickList(); },
  backPicker: () => openSheet(exercisePicker()),
  exInfo: el => { infoFromPicker = !!el.closest('#sheet'); if (!infoFromPicker) sheetFor = null; exInfoSheet(el.dataset.lib, el.dataset.id); },
  addLib: el => { if (!el.dataset.id && !LIBX[el.dataset.lib]) return; const id = el.dataset.id || ensureEx(el.dataset.lib); addPicked(id); toast('เพิ่ม ' + ex(id).name + ' แล้ว'); },
  pickedEx: el => addPicked(el.dataset.id),
  createEx: () => {
    const name = $('#newExName').value.trim(); if (!name) { toast('ใส่ชื่อท่าก่อน'); return; }
    const e = { id: uid(), name, muscle: $('#newExMuscle').value }; S.exercises.push(e); addPicked(e.id);
  },

  progTab: el => { progTab = el.dataset.k; render(); },
  addBw: () => {
    const kg = num($('#bwIn').value); if (!kg || kg < 20 || kg > 400) { toast('ใส่น้ำหนักให้ถูกต้อง'); return; }
    const d = ymd(new Date()); S.bodyweight = S.bodyweight.filter(b => b.date !== d); S.bodyweight.push({ date: d, kg });
    S.bodyweight.sort((a, b) => a.date.localeCompare(b.date)); save(); render(); toast('บันทึกน้ำหนักแล้ว');
  },
  rmBw: el => { S.bodyweight = S.bodyweight.filter(b => b.date !== el.dataset.d); save(); render(); },

  newTpl: () => { const t = { id: uid(), name: 'ชุดท่าใหม่', exerciseIds: [] }; S.templates.push(t); save(); editing = t.id; openSheet(tplEditor(t)); render(); },
  editTpl: el => { editing = el.dataset.t; openSheet(tplEditor(tpl(editing))); },
  tplMove: el => { const t = tpl(editing), i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= t.exerciseIds.length) return; t.name = $('#tplName').value; [t.exerciseIds[i], t.exerciseIds[j]] = [t.exerciseIds[j], t.exerciseIds[i]]; save(); openSheet(tplEditor(t)); },
  tplRm: el => { const t = tpl(editing); t.name = $('#tplName').value; t.exerciseIds.splice(+el.dataset.i, 1); save(); openSheet(tplEditor(t)); },
  tplSave: () => { tpl(editing).name = $('#tplName').value.trim() || 'ไม่มีชื่อ'; save(); closeSheet(); render(); toast('บันทึกแล้ว'); },
  tplDelete: () => {
    if (!confirm('ลบชุดท่านี้? (ประวัติการเล่นยังอยู่ครบ)')) return;
    S.templates = S.templates.filter(t => t.id !== editing); S.schedule = S.schedule.map(id => id === editing ? null : id); save(); closeSheet(); render();
  },

  exportData: async () => {
    S.lastBackup = Date.now(); save();
    const name = `liftlog-backup-${ymd(new Date())}.json`;
    const file = new File([JSON.stringify(S, null, 1)], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); toast('สำรองข้อมูลแล้ว'); settingsSheet(); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); URL.revokeObjectURL(a.href);
    toast('ดาวน์โหลดไฟล์สำรองแล้ว'); settingsSheet();
  },
  importData: () => $('#importFile').click(),
  resetData: () => {
    if (!confirm('ลบข้อมูลทั้งหมดในเครื่องนี้? กู้คืนไม่ได้ถ้าไม่มีไฟล์สำรอง')) return;
    if (prompt('พิมพ์คำว่า ลบ เพื่อยืนยัน') !== 'ลบ') return;
    S = seed(); save(); closeSheet(); tab = 'home'; render(); toast('ล้างข้อมูลแล้ว');
  },
};

const PLATE_COLOR = { 25: '#FF4D5E', 20: '#3D8BFF', 15: '#FFD23F', 10: '#3DDC84', 5: '#F2F5F7', 2.5: '#8A94A3', 1.25: '#59616D' };
function drawPlates() {
  const t = num($('#pcW').value), bar = num($('#pcBar').value), out = $('#pcOut');
  if (!t) { out.innerHTML = ''; return; }
  const r = plates(t, bar);
  if (!r) { out.innerHTML = `<div class="empty">น้ำหนักน้อยกว่าบาร์</div>`; return; }
  out.innerHTML = `<div class="card" style="text-align:center"><div class="muted small">ใส่ข้างละ</div>
    <div style="display:flex;justify-content:center;align-items:center;gap:4px;margin:14px 0;min-height:90px">${r.out.length ? r.out.map(p => `<div style="width:${p >= 10 ? 26 : 20}px;height:${30 + p * 2.4}px;border-radius:5px;background:${PLATE_COLOR[p]}"></div>`).join('') : '<span class="muted">ไม่ต้องใส่จาน</span>'}</div>
    <div class="num" style="font-size:18px">${r.out.join(' + ') || '–'}</div>
    ${r.rest ? `<div class="small" style="color:var(--hot);margin-top:6px">จานไม่พอดี ขาดไป ${r.rest} kg</div>` : ''}</div>`;
}
function completeSet(ii, si, follow) {
  const it = S.active.items[ii], s = it.sets[si];
  if (num(s.r) <= 0) { toast('ใส่จำนวนครั้งก่อนนะ'); return; }
  if (s.w === '') s.w = '0';
  s.done = true;
  // โหมดทีละเซ็ต: ถ้าเปลี่ยนน้ำหนัก เซ็ตที่เหลือของท่านี้ใช้น้ำหนักตามไปด้วย
  if (follow) it.sets.forEach(x => { if (!x.done) x.w = s.w; });
  if (navigator.vibrate) navigator.vibrate(40);
  save(); render();
  if (cursor()) startRest(); else { restEnd = 0; tick(); askFinish(); }
}
function askFinish() {
  openSheet(`<div style="text-align:center"><h1>ครบทุกเซ็ตแล้ว 🎉</h1><p class="muted">จบและบันทึกการเล่นครั้งนี้เลยไหม?</p></div>
    <div class="stack"><button class="btn primary xl" data-a="finish">จบและบันทึก</button>
    <button class="btn ghost" data-a="pickEx" data-for="active">ยังไหว เพิ่มท่า</button>
    <button class="link" style="color:var(--muted);display:block;margin:0 auto" data-a="closeSheet">ยังก่อน</button></div>`);
}
function addPicked(id) {
  if (sheetFor === 'active') { S.active.items.push(newItem(id)); focusIi = S.active.items.length - 1; save(); closeSheet(); render(); }
  else { const t = tpl(editing); t.exerciseIds.push(id); save(); openSheet(tplEditor(t)); render(); }
}

document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && el.tagName !== 'SELECT' && A[el.dataset.a]) A[el.dataset.a](el); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ff && S.active) { const c = cursor(); if (c) { S.active.items[c.ii].sets[c.si][el.dataset.ff] = el.value; save(); } }
  if (el.dataset.f && el.dataset.i !== undefined && S.active) { S.active.items[el.dataset.i].sets[el.dataset.s][el.dataset.f] = el.value; save(); }
  if (el.id === 'exSearch') { pickQ = el.value; pickN = 30; $('#exList').innerHTML = pickList(); const n = $('#newExName'); if (n) n.value = pickQ; }
  if (el.id === 'tplName' && editing) { tpl(editing).name = el.value; save(); }
  if (el.id === 'pcW') drawPlates();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.a === 'setDay') { S.schedule[+el.dataset.d] = el.value || null; save(); toast('อัปเดตตารางแล้ว'); }
  if (el.dataset.a === 'progEx') { progEx = el.value; render(); }
  if (el.id === 'restSel') { S.restSec = +el.value; save(); toast('ตั้งเวลาพักเป็น ' + mmss(S.restSec) + ' นาที'); }
  if (el.id === 'pcBar') drawPlates();
  if (el.id === 'goalSel') { S.goal = +el.value; save(); toast('ตั้งเป้า ' + S.goal + ' วันต่อสัปดาห์'); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wakeOn(); tick(); } });
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.version || !Array.isArray(d.workouts)) throw 0;
    if (!confirm(`กู้คืนข้อมูล ${d.workouts.length} ครั้ง จากไฟล์นี้? ข้อมูลปัจจุบันในเครื่องจะถูกแทนที่`)) return;
    S = d; save(); closeSheet(); tab = 'home'; render(); toast('กู้คืนข้อมูลเรียบร้อย');
  } catch (err) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอป'); }
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
render(); wakeOn();
</script>
</body>
</html>
